<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه | IQDWS</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">سامانه IQDWS</h1>
            <p class="login-subtitle">مدیریت هوشمند کیفیت، ایراد، گارانتی و اخطار کیفی</p>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>نام کاربری (کد پرسنلی) <span class="req">*</span></label>
                    <input type="text" id="login-username" class="form-control" placeholder="مثال: 123456" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور <span class="req">*</span></label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">ورود به سامانه</button>
            </form>
            
            <div style="margin-top:20px; font-size:11px; text-align:center; color:#888;">
                برای تست: نام کاربری <b>admin</b> و رمز <b>admin</b><br>
                (سایر کاربران: 101، 102، 103 با رمز 123456)
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
