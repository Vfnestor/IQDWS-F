<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه | IQDWS</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">سامانه IQDWS</h1>
            <p class="login-subtitle">مدیریت هوشمند کیفیت، ایراد، گارانتی و اخطار کیفی</p>

            <div class="form-group">
                <label>۱. انتخاب سامانه:</label>
                <div class="app-tiles">
                    <div class="app-tile" onclick="selectApp('main')" id="tile-main">
                        <span class="icon">🏭</span>
                        <h3>سامانه مادر</h3>
                        <p>ثبت ایراد و پیگیری</p>
                    </div>
                    <div class="app-tile" onclick="selectApp('supplier')" id="tile-supplier">
                        <span class="icon">🔧</span>
                        <h3>سامانه سازنده</h3>
                        <p>بازرسی و پاسخ ۸D</p>
                    </div>
                    <div class="app-tile" onclick="selectApp('admin')" id="tile-admin">
                        <span class="icon">⚙️</span>
                        <h3>پنل مدیریت</h3>
                        <p>پشتیبانی و اکوسیستم</p>
                    </div>
                </div>
            </div>

            <div class="form-group" id="role-container" style="display: none;">
                <label>۲. انتخاب نقش:</label>
                <select id="role-select" class="form-control"></select>
            </div>

            <button class="btn btn-primary btn-block" id="login-btn" onclick="handleLogin()" disabled>ورود به سامانه</button>
        </div>
    </div>

    <script src="assets/js/store.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
