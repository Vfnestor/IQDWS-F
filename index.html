<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQDWS — ورود به اکوسیستم کیفیت</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-logo">IQ</div>
      <h1 class="login-brand-title">IQDWS</h1>
      <p class="login-brand-sub">اکوسیستم یکپارچه کیفیت خودرو</p>
    </div>

    <!-- ▼▼▼ فرم ورود فعلی خود را اینجا قرار دهید — بدون تغییر منطق ▼▼▼ -->
    <form id="login-form" autocomplete="on">
      <!-- فیلدهای فعلی شما: نام کاربری، رمز عبور، دکمه ورود -->
    </form>
    <!-- ▲▲▲ پایان فرم فعلی ▲▲▲ -->
  </div>

  <script type="module" src="assets/js/pages/login.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
