<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | IQDWS</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/tables.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div id="app" class="app-layout">
        <header class="app-header admin-header">
            <div class="header-brand">⚙️ پنل مدیریت اکوسیستم</div>
            <div class="header-user">
                <span id="user-name">مدیر سیستم</span>
                <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
            </div>
        </header>
        <div class="app-body">
            <nav class="sidebar admin-sidebar">
                <a onclick="navigate('dashboard')" class="nav-item active">📈 آمار و وضعیت</a>
                <a onclick="navigate('support')" class="nav-item">🛠️ پشتیبانی و باگ‌ها</a>
                <a onclick="navigate('settings')" class="nav-item">⚙️ تنظیمات (به‌زودی)</a>
            </nav>
            <main class="content" id="content-area"></main>
        </div>
    </div>

    <!-- Modules -->
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/modules/utils.js"></script>
    <script src="assets/js/modules/admin-api.js"></script>
    <script src="assets/js/modules/admin-dashboard.js"></script>
    <script src="assets/js/modules/admin-support.js"></script>

    <script>
        const session = checkAuth('admin');
        if (session) document.getElementById('user-name').innerText = session.roleName;

        function navigate(view) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const navItems = document.querySelectorAll('.nav-item');
            
            if (view === 'dashboard') { 
                navItems[0].classList.add('active'); 
                renderAdminDashboard(); 
            }
            if (view === 'support') { 
                navItems[1].classList.add('active'); 
                renderSupportPanel(); 
            }
            if (view === 'settings') { 
                navItems[2].classList.add('active'); 
                document.getElementById('content-area').innerHTML = '<div class="card"><h2>تنظیمات اکوسیستم</h2><p>این بخش برای مدیریت دسترسی‌ها و کلیدهای API در فاز بعدی توسعه می‌یابد.</p></div>'; 
            }
        }

        window.onload = () => navigate('dashboard');
    </script>

    <!-- اسکریپت‌های شما -->
    <script>
        // ثبت Service Worker برای PWA (در همه صفحات)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

</body>
</html>
