<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | IQDWS</title>
    <link rel="stylesheet" href="assets/css/main.css?v=3">
    <link rel="stylesheet" href="assets/css/components.css?v=3">
    <link rel="stylesheet" href="assets/css/forms.css?v=3">
    <link rel="stylesheet" href="assets/css/tables.css?v=3">
    <link rel="stylesheet" href="assets/css/admin.css?v=3">
</head>
<body>
    <div id="app" class="app-layout">
        <header class="app-header admin-header">
            <div class="header-brand">
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
                ⚙️ پنل مدیریت اکوسیستم
            </div>
            <div class="header-user">
                <span id="user-info" style="font-weight:bold; font-size:13px;"></span>
                <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
            </div>
        </header>
        <div class="app-body">
            <div class="sidebar-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
            <nav class="sidebar admin-sidebar" id="main-sidebar">
                <div class="sidebar-header">
                    <span>منوی مدیریت</span>
                    <button class="close-btn" onclick="toggleMenu()">✖</button>
                </div>
                <a onclick="navigate('dashboard')" class="nav-item" id="nav-dashboard">📈 آمار و وضعیت</a>
                <a onclick="navigate('users')" class="nav-item" id="nav-users">👥 مدیریت کاربران</a>
                <a onclick="navigate('support')" class="nav-item" id="nav-support">🛠️ پشتیبانی و باگ‌ها</a>
            </nav>
            <main class="content" id="content-area"></main>
        </div>
    </div>

    <!-- اسکریپت‌ها با نسخه 3 برای دور زدن کش -->
    <script src="assets/js/config.js?v=3"></script>
    <script src="assets/js/auth.js?v=3"></script>
    <script src="assets/js/modules/utils.js?v=3"></script>
    <script src="assets/js/modules/admin-api.js?v=3"></script>
    <script src="assets/js/modules/admin-dashboard.js?v=3"></script>
    <script src="assets/js/modules/admin-support.js?v=3"></script>
    <script src="assets/js/modules/admin-users.js?v=3"></script>

    <script>
        const session = checkAuth('admin');
        if (session) {
            document.getElementById('user-info').innerText = `${session.displayName} (${session.roleName})`;
        }

        function toggleMenu() {
            document.getElementById('main-sidebar').classList.toggle('active');
            document.getElementById('menu-overlay').classList.toggle('active');
        }

        function navigate(view) {
            if(window.innerWidth < 768) toggleMenu();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${view}`);
            if(activeNav) activeNav.classList.add('active');

            // ریست کردن وضعیت صفحه کاربران هنگام ورود
            if (view === 'users') {
                adminUserView = 'list';
                currentSearchFilter = { role: '', username: '', defectCode: '' };
            }

            if (view === 'dashboard') renderAdminDashboard();
            else if (view === 'users') renderUserManagement();
            else if (view === 'support') renderSupportPanel();
        }

        window.onload = () => navigate('dashboard');
    </script>
</body>
</html>
