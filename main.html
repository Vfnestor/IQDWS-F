<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مادر | IQDWS</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/tables.css">
    <link rel="stylesheet" href="assets/css/analytics.css">
</head>
<body>
    <div id="app" class="app-layout">
        <header class="app-header">
            <div class="header-brand">🏭 سامانه مادر IQDWS</div>
            <div class="header-user">
                <span id="user-name">نقش کاربر</span>
                <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
            </div>
        </header>
        <div class="app-body">
            <nav class="sidebar">
                <a onclick="navigate('dashboard')" class="nav-item active">📊 داشبورد</a>
                <a onclick="navigate('new-defect')" class="nav-item">➕ ثبت ایراد</a>
                <a onclick="navigate('defects')" class="nav-item">📋 لیست ایرادها</a>
                <a onclick="navigate('qans')" class="nav-item">⚠️ اخطارهای کیفی</a>
                <a onclick="navigate('analytics')" class="nav-item">🏢 عملکرد سازندگان</a>
            </nav>
            <main class="content" id="content-area"></main>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/modules/utils.js"></script>
    <script src="assets/js/modules/api.js"></script>
    <script src="assets/js/modules/dashboard.js"></script>
    <script src="assets/js/modules/defect.js"></script>
    <script src="assets/js/modules/qan.js"></script>
    <script src="assets/js/modules/main-analytics.js"></script>

    <script>
        const session = checkAuth('main');
        if (session) document.getElementById('user-name').innerText = session.roleName;

        function navigate(view) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const navItems = document.querySelectorAll('.nav-item');
            
            if(view === 'dashboard') { navItems[0].classList.add('active'); renderDashboard(); }
            if(view === 'new-defect') { navItems[1].classList.add('active'); renderNewDefectForm(); }
            if(view === 'defects') { navItems[2].classList.add('active'); renderDefectList(); }
            if(view === 'qans') { navItems[3].classList.add('active'); renderQANList(); }
            if(view === 'analytics') { navItems[4].classList.add('active'); renderMainAnalytics(); }
        }

        window.onload = () => navigate('dashboard');
    </script>
</body>
</html>
